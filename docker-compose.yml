services: 
  db:
    image: postgres
    environment:
      - POSTGRES_PASSWORD=mysecretpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  
  api:
    build: . 
    environment:
      - DATABASE_URL=postgresql://postgres:mysecretpassword@db:5432/expense_splitter
      - SECRET_KEY=expense-key-for-splitting
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  postgres_data: